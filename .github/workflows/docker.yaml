name: Docker Build and Push

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Extract Docker image metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ vars.DOCKER_USERNAME }}/website

            - name: Log in to Docker Hub
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  secrets: |
                      base_url=${{secrets.BASE_URL}}
                      better_auth_secrets=${{secrets.BETTER_AUTH_SECRETS}}
                      better_auth_url=${{secrets.BETTER_AUTH_URL}}
                      database_url=${{secrets.DATABASE_URL}}
                      google_client_id=${{secrets.GOOGLE_CLIENT_ID}}
                      google_client_secret=${{secrets.GOOGLE_CLIENT_SECRET}}
                      mailerlite_api_key=${{secrets.MAILERLITE_API_KEY}}
                      microsoft_client_id=${{secrets.MICROSOFT_CLIENT_ID}}
                      microsoft_client_secret=${{secrets.MICROSOFT_CLIENT_SECRET}}
                      s3_bucket=${{secrets.S3_BUCKET}}
                      s3_bucket_region=${{secrets.S3_BUCKET_REGION}}
                      yandex_client_id=${{secrets.YANDEX_CLIENT_ID}}
                      yandex_client_secret=${{secrets.YANDEX_CLIENT_SECRET}}
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  annotations: ${{ steps.meta.outputs.annotations }}
                  provenance: true
                  sbom: true
